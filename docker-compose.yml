services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: devforum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dev_db
      POSTGRES_USER: DEV
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DEV -d dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devforum-net

  # 2. Spring Boot Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devforum-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085

      # Force Postgres (overrides the Oracle profile/driver in application.yml)
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dev_db
      SPRING_DATASOURCE_USERNAME: DEV
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # Auth / storage
      JWT_SECRET_FILE: /app/config/jwt-secret.key
      STORAGE_BASE_PATH: /app/uploads
      STORAGE_BASE_URL: ${PUBLIC_API_URL}/files

      # URLs / CORS
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      APP_FRONTEND_URL: ${FRONTEND_URL}

      # Mail (Gmail)
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
    volumes:
      - api_uploads:/app/uploads
      - api_config:/app/config
    networks:
      - devforum-net

volumes:
  postgres_data:
  api_uploads:
  api_config:

networks:
  devforum-net:
    driver: bridge
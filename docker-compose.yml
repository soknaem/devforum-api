services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: devforum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"   # reachable from this machine only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: If you have SQL init scripts in a ./db folder, uncomment the line below:
      # - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devforum-net

  # 2. Spring Boot Backend API (UI is hosted on Vercel)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devforum-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8085"   # cloudflared on this machine connects here
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # Database (host is the compose service name)
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}

      # Mail
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@devforum.local}

      # Cookies
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-None}

      # URLs
      FRONTEND_URL: ${FRONTEND_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - api_uploads:/app/uploads
      - api_config:/app/config
    networks:
      - devforum-net

volumes:
  postgres_data:
  api_uploads:
  api_config:

networks:
  devforum-net:
    driver: bridge
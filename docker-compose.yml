services:
  postgres:
    image: postgres:16-alpine
    container_name: devforum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dev_db
      POSTGRES_USER: DEV
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DEV -d dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devforum-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devforum-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dev_db
      SPRING_DATASOURCE_USERNAME: DEV
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET_FILE: /app/config/jwt-secret.key
      STORAGE_BASE_PATH: /app/uploads
      STORAGE_BASE_URL: ${PUBLIC_API_URL}/files
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      APP_FRONTEND_URL: ${FRONTEND_URL}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
    volumes:
      - api_uploads:/app/uploads
      - api_config:/app/config
    networks:
      - devforum-net


volumes:
  postgres_data:
  api_uploads:
  api_config:

networks:
  devforum-net:
    driver: bridge
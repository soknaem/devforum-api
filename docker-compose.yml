services:
  postgres:
    image: postgres:16-alpine
    container_name: devforum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dev_db
      POSTGRES_USER: DEV
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DEV -d dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devforum-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devforum-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Database
      DB_URL: jdbc:postgresql://postgres:5432/dev_db
      DB_USERNAME: DEV
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JPA_DDL_AUTO: update

      # Mail
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # URLs / CORS / cookies
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE}

      # Paths inside the container
      JWT_SECRET_FILE: /app/config/jwt-secret.key
      STORAGE_BASE_PATH: /app/uploads
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - api_uploads:/app/uploads
      - api_config:/app/config
    networks:
      - devforum-net

volumes:
  postgres_data:
  api_uploads:
  api_config:

networks:
  devforum-net:
    driver: bridge
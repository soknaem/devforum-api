  # Multipart upload limits for resource media (images, PDFs/books, code archives, etc.)
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 200MB

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus" # Prometheus is great for high-perf monitoring
  endpoint:
    metrics:
      access: unrestricted


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

#logging:
#  level:
#    root: ERROR

jwt:
  # The signing key is NOT read from here anymore. On first boot, JwtKeyManager generates a
  # cryptographically random 256-bit key and persists it to `secret-file` below, then reuses the
  # same key on every later boot so previously issued tokens keep validating. Delete the file to
  # force a fresh key (this invalidates all existing tokens).
  secret-file: ./config/jwt-secret.key
  expiration-ms: 86400000 # 24 hours

# Local disk storage for uploaded resource media (images, ebooks/PDFs, code archives, etc.)
# and user avatar/cover images. Swap this out for S3/GCS later without touching controllers —
# only StorageService's implementation needs to change.
storage:
  base-path: ./uploads
  base-url: http://localhost:8085/files
  allowed-extensions: jpg,jpeg,png,gif,webp,pdf,zip,tar,gz,md,txt,java,py,js,ts,json,yml,yaml
  max-file-size-mb: 50

# CORS for the future Next.js frontend
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:3001
    - https://devforum-ten.vercel.app
    - https://*.vercel.app

# Archived resources are a recycle bin: deleted for good after this many days.
app:
  archive:
    retention-days: 30
    purge-cron: "0 30 3 * * *"   # every night at 03:30
  frontend-url: https://devforum-ten.vercel.app   # used to build the link in the password reset e-mail
  mail:
    from: no-reply@devforum.local


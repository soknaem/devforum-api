env:
  # Database (PostgreSQL in docker compose)
  db-url: ${DB_URL}
  db-username: ${DB_USERNAME}
  db-password: ${DB_PASSWORD}
  jpa-ddl-auto: ${JPA_DDL_AUTO:update}
  jpa-show-sql: false

  # Mail (Gmail)
  mail-host: smtp.gmail.com
  mail-port: 587
  mail-username: ${MAIL_USERNAME:}
  mail-password: ${MAIL_PASSWORD:}
  mail-auth: true
  mail-starttls: true
  mail-from: ${MAIL_FROM:no-reply@devforum.local}

  # Cookie (SameSite=None + Secure requires HTTPS)
  cookie-secure: ${COOKIE_SECURE:true}
  cookie-same-site: ${COOKIE_SAME_SITE:None}

  # URLs
  frontend-url: ${FRONTEND_URL}
  files-base-url: ${PUBLIC_API_URL}/files
  cors-origins: ${CORS_ORIGINS}

  # Logging
  log-level-cors: INFO